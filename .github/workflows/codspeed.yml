name: CodSpeed

# Measures both benchmark suites on CodSpeed, per `bench` leaf, using the
# konn/haskell-codspeed harness. The suites are ordinary tasty-bench suites --
# the only difference is that they import Test.Tasty.Bench.CodSpeed, which
# behaves identically when no runner is attached.
#
# Two metrics come out of a run:
#
#   instruction counts   from CodSpeed's CPU simulation, per benchmark, which is
#                        what the PR comment and the dashboard show
#   allocated bytes      from GHC's own per-thread allocation counter, written
#                        to a CSV by the suite and compared against main below.
#                        Exactly reproducible for fixed code and input, which
#                        for a deterministic saturation algorithm makes it the
#                        sharper of the two signals.
#
# Budget: simulation is roughly 200x native. One deterministic pass over both
# suites is ~11 s natively (~8 s math, of which ~5 s is the cross-validation
# `annotateControlled` does before defaultMain is even reached, and ~3 s
# hashmap), so expect the measured step to take on the order of 30-45 minutes.
# If that becomes the binding constraint, the lever is a tasty `--pattern` in
# ci/scripts/codspeed-bench.sh -- but note that narrowing the set changes which
# URIs report, not how each is measured.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One upload per commit. Two `codspeed run` invocations racing for the same ref
# is the one thing the backend handles badly: it keeps whichever arrived last.
concurrency:
  group: codspeed-${{github.ref}}
  cancel-in-progress: true

env:
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.16.1.0"
  # The same project file the build and test jobs use, so the measured binary
  # comes out of the same resolved plan as everything else CI builds.
  PROJECT_FILE: ci/configs/ghc-9.12.4.project

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    # Simulation is slow, and a build from a cold cabal store is slower.
    timeout-minutes: 180
    permissions:
      contents: read
      # Reading the previous allocation sidecar off main's run.
      actions: read
      # Lets the runner exchange an OIDC token, so this public repository needs
      # no CODSPEED_TOKEN secret.
      #
      # Do not "helpfully" add `token: ${{secrets.CODSPEED_TOKEN}}` as a
      # fallback. An unset secret expands to the empty string, which the runner
      # still binds as a present-but-invalid token and then skips OIDC entirely
      # -- producing a 401 at upload that looks like a permissions problem and
      # is not.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{env.GHC_VERSION}}
          cabal-version: ${{env.CABAL_VERSION}}

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{steps.setup.outputs.cabal-store}}
            dist-newstyle
          key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project', 'cabal.project.freeze', 'ci/configs/ghc-9.12.4.project', 'tamagoh.cabal')}}
          restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

      # Built before the measurement step so compilation is nowhere near the
      # window. All four at once, because the measured command chains three of
      # them and `cabal list-bin` reports where a binary *would* be, built or
      # not -- so forgetting one surfaces as exit 127 from inside Valgrind
      # rather than as a build error.
      - name: Build the benchmarks and the harness tools
        run: |
          cabal update
          cabal --project-file="${PROJECT_FILE}" build \
            bench:tamagoh-bench-math \
            bench:tamagoh-bench-hashmap \
            codspeed-hs-rewrite \
            codspeed-hs-compare

      - name: Locate the binaries
        id: bin
        run: |
          set -euo pipefail
          cabal_bin () {
            cabal --project-file="${PROJECT_FILE}" list-bin "$1" | tail -1
          }
          {
            echo "math=$(cabal_bin bench:tamagoh-bench-math)"
            echo "hashmap=$(cabal_bin bench:tamagoh-bench-hashmap)"
            echo "rewrite=$(cabal_bin codspeed-hs-rewrite)"
            echo "compare=$(cabal_bin codspeed-hs-compare)"
          } >>"$GITHUB_OUTPUT"
          # list-bin does not check, so check.
          for t in bench:tamagoh-bench-math bench:tamagoh-bench-hashmap \
                   codspeed-hs-rewrite codspeed-hs-compare; do
            test -x "$(cabal_bin "$t")" || { echo "::error::$t was not built"; exit 1; }
          done

      # Simulation rather than walltime: it is deterministic, and a
      # GitHub-hosted runner is far too noisy for walltime to mean anything on
      # workloads this size.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          MATH_BIN: ${{steps.bin.outputs.math}}
          HASHMAP_BIN: ${{steps.bin.outputs.hashmap}}
          REWRITE_BIN: ${{steps.bin.outputs.rewrite}}
          SIDECAR_DIR: ${{github.workspace}}/sidecar
          # NOT set: CODSPEED_HS_CCS_DIR. Setting it makes the chained rewriter
          # merge GHC cost centres into the call graph rather than only decode
          # symbols, which upstream measured as producing a single-frame
          # flamegraph and moving the reported metric. Cost-centre profiles are
          # a local artifact for now; see the harness README.
        with:
          mode: simulation
          run: bash ci/scripts/codspeed-bench.sh

      # The sidecar is measured under the instrument, on a code path no local
      # run exercises, so check there that it measured the benchmark rather
      # than the harness. Upstream shipped this broken once -- every benchmark
      # reported a constant few kilobytes, which was plausible and wrong -- so
      # assert something the suite cannot accidentally satisfy: the six
      # controlled cases allocate tens of megabytes each.
      - name: Check the sidecar measured the benchmarks
        if: always()
        run: |
          set -euo pipefail
          for f in sidecar/allocation-math.csv sidecar/allocation-hashmap.csv; do
            [ -f "$f" ] || { echo "::error::$f was never written"; exit 1; }
          done
          cat sidecar/allocation-math.csv
          # Natively ~217 MB. Anything under 1 MB means the allocation counter
          # is being read somewhere other than the benchmark's own thread.
          alloc=$(awk -F, '$1 ~ /merge-rebuild.*\.tamagoh$/ {print $2}' \
            sidecar/allocation-math.csv)
          [ -n "$alloc" ] || { echo "::error::no merge-rebuild row in the sidecar"; exit 1; }
          echo "merge-rebuild tamagoh allocated ${alloc} B"
          [ "$alloc" -gt 1000000 ] || {
            echo "::error::merge-rebuild allocated ${alloc} B; expected hundreds of MB"
            exit 1
          }

      # Allocation is exact, so a change in it is a real change -- but the
      # controlled benchmarks carry their e-graph size in their own names
      # (`...-nodes-22499-classes-16499`), so any change to what saturation
      # explores renames the benchmark rather than moving its number, and the
      # comparison reports that as a removal plus an addition. Both are worth
      # seeing and neither is worth blocking a merge on by default, so this
      # reports rather than gates. Drop `continue-on-error` to make it a gate.
      - name: Fetch the allocation baseline from main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow codspeed.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::notice::no successful CodSpeed run on main yet; nothing to compare against"
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if gh run download "$run_id" --name allocation-csv --dir baseline; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::run ${run_id} has no allocation-csv artifact (expired?)"
            echo "found=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Compare allocation against main
        if: steps.baseline.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          {
            echo "## Allocation vs main"
            for f in allocation-math.csv allocation-hashmap.csv; do
              echo ""
              echo "### ${f}"
              echo '```'
              if [ -f "baseline/${f}" ]; then
                "${{steps.bin.outputs.compare}}" "baseline/${f}" "sidecar/${f}" \
                  --tolerance 0.01 2>&1 || status=1
              else
                echo "no baseline for ${f}"
              fi
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || echo "::warning::allocation grew against main; see the job summary"
          exit "$status"

      # Uploaded unconditionally, and under a stable name, because the run on
      # main is the baseline every later pull request downloads.
      - name: Upload allocation sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocation-csv
          path: sidecar/
          if-no-files-found: warn
